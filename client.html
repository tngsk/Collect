<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Sound Eval</title>
        <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="h-screen w-screen bg-base-100 text-base-content overflow-hidden flex flex-col">
        <div id="phase-WAITING" class="flex flex-col flex-1 justify-center items-center p-5 text-center phase-container">
            <h1 class="text-4xl font-bold mb-4">LOOK AT<br />THE SCREEN</h1>
            <p class="text-xl text-primary mt-4">
                前方のスクリーンに注目してください
            </p>
        </div>

        <div id="phase-EVALUATE" class="hidden flex-col flex-1 justify-center items-center p-5 text-center phase-container">
            <h1 class="text-3xl font-bold mb-6">HOW DID IT SOUND?</h1>
            <div class="grid grid-cols-1 gap-4 w-full max-w-sm mt-8" id="choices">
                <button class="btn btn-outline btn-lg w-full choice-btn" data-val="1_非常に不快">
                    非常に不快
                </button>
                <button class="btn btn-outline btn-lg w-full choice-btn" data-val="2_やや不快">
                    やや不快
                </button>
                <button class="btn btn-outline btn-lg w-full choice-btn" data-val="3_やや快適">
                    やや快適
                </button>
                <button class="btn btn-outline btn-lg w-full choice-btn" data-val="4_非常に快適">
                    非常に快適
                </button>
            </div>
        </div>

        <div id="phase-FINISHED" class="hidden flex-col flex-1 justify-center items-center p-5 text-center phase-container">
            <h1 class="text-4xl font-bold text-primary mb-4">THANK YOU</h1>
            <p class="text-xl">回答を記録しました</p>
        </div>

        <script>
            let clientId = localStorage.getItem("situs_client_id");
            if (!clientId) {
                clientId = "user_" + Math.random().toString(36).substr(2, 9);
                localStorage.setItem("situs_client_id", clientId);
            }

            let eventSource;
            let startTime = 0;

            function connectSSE() {
                eventSource = new EventSource('/sse/client');

                eventSource.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    if (msg.type === "phase_change") {
                        switchPhase(msg.phase);
                    }
                };
            }

            function switchPhase(phase) {
                document
                    .querySelectorAll(".phase-container")
                    .forEach((el) => {
                        el.classList.remove("flex");
                        el.classList.add("hidden");
                    });
                const basePhase = phase.split("_")[0];
                const targetEl = document.getElementById(`phase-${basePhase}`);

                if (targetEl) {
                    targetEl.classList.remove("hidden");
                    targetEl.classList.add("flex");
                    if (basePhase === "EVALUATE") {
                        startTime = performance.now();
                        document
                            .querySelectorAll(".choice-btn")
                            .forEach((btn) => (btn.disabled = false));
                    }
                }
            }

            document.querySelectorAll(".choice-btn").forEach((btn) => {
                btn.addEventListener("click", async (e) => {
                    document
                        .querySelectorAll(".choice-btn")
                        .forEach((b) => (b.disabled = true));
                    const rt = performance.now() - startTime;
                    const response = e.target.getAttribute("data-val");

                    try {
                        await fetch('/submit', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                client_id: clientId,
                                response: response,
                                rt: Math.round(rt)
                            })
                        });
                    } catch (err) {
                        console.error('Failed to submit response:', err);
                    }

                    switchPhase("FINISHED");
                });
            });

            connectSSE();
        </script>
    </body>
</html>
