<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SITU Workshop Screen</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen w-screen bg-base-100 text-base-content flex justify-center items-center overflow-hidden">
    <div id="chart-container" class="w-[90vw] h-[80vh] flex justify-center items-center">
        <h1 class="text-3xl text-base-content/50 font-sans text-center">Waiting for data...</h1>
    </div>

    <script>
        const eventSource = new EventSource('/sse/screen');

        eventSource.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === "show_result") {
                const figure = JSON.parse(msg.chart_data);
                Plotly.newPlot('chart-container', figure.data, figure.layout, {displayModeBar: false, responsive: true});
            }
        };
    </script>
</body>
</html>
